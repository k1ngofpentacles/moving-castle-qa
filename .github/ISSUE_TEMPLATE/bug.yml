name: Bug report
description: A crash or bug outside a QA check
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
  - type: input
    id: versions
    attributes:
      label: Mod versions
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Logs
      description: Drag in latest.log or the crash report
