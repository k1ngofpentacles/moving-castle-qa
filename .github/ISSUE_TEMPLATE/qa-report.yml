name: QA report
description: Result of one or more QA checks
title: "[QA] <chapter>.<check>: pass/fail"
labels: [qa]
body:
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      options:
        - aspect_interpreter
        - concilium
        - forbidden_magic
        - gadomancy
        - horizons
    validations:
      required: true
  - type: input
    id: check
    attributes:
      label: Check id(s)
      description: As shown under each check, e.g. concilium.protobody (comma-separate several)
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Pass, Fail, Partly works, Could not test]
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you saw
      description: What happened instead of the expected result. Screenshots welcome.
  - type: textarea
    id: feel
    attributes:
      label: How it felt
      description: Balance, clarity, fun (optional)
  - type: input
    id: versions
    attributes:
      label: Mod versions
      description: e.g. Concilium 0.17.1, Forbidden Magic 0.2.1, Horizons 0.11.2
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: qa_verdicts.log and logs
      description: Drag in qa_verdicts.log (minecraft folder), latest.log or a crash report
